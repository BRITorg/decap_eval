backend:
  name: github
  repo: BRITorg/decap_eval
  branch: main
  # base_url points at the Cloudflare Worker OAuth proxy (not deployed yet).
  # Fill this in once the Worker is live, e.g. https://dcap-eval-oauth.<subdomain>.workers.dev
  base_url: https://REPLACE-WITH-OAUTH-WORKER-URL

media_folder: content/images
public_folder: /content/images

collections:
  - name: pages
    label: Pages
    folder: content/pages
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }
