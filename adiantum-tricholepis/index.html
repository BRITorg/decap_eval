<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Species | Decap CMS Pipeline Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    .meta { color: #666; font-size: 0.85rem; }
    .field { margin: 0.25rem 0; }
    .field b { display: inline-block; min-width: 7rem; }
  </style>
</head>
<body>
  <p><a href="../">&larr; Home</a></p>
  <div id="species">Loading&hellip;</div>

  <script>
    const OWNER = 'BRITorg';
    const REPO = 'decap_eval';
    const BRANCH = 'main';

    function parseFrontMatter(raw) {
      const match = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
      if (!match) return { data: {}, body: raw };
      const data = {};
      match[1].split('\n').forEach(line => {
        const idx = line.indexOf(':');
        if (idx === -1) return;
        const key = line.slice(0, idx).trim();
        const value = line.slice(idx + 1).trim();
        data[key] = value;
      });
      return { data, body: match[2].trim() };
    }

    function renderBody(body) {
      return body
        .split(/\n\n+/)
        .map(p => `<p>${p.trim()}</p>`)
        .join('\n');
    }

    function slugFromPath() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      return parts[parts.length - 1];
    }

    async function loadSpecies() {
      const container = document.getElementById('species');
      const slug = slugFromPath();
      try {
        const res = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/content/species/${slug}.md`);
        if (!res.ok) throw new Error(`Not found: ${slug}`);
        const raw = await res.text();
        const { data, body } = parseFrontMatter(raw);
        container.innerHTML = `
          <h1><em>${data.title || slug}</em></h1>
          <div class="field"><b>Family:</b> ${data.family || ''}</div>
          <div class="field"><b>Common names:</b> ${data.common_names || ''}</div>
          ${renderBody(body)}
        `;
      } catch (err) {
        container.innerHTML = `<p>Could not load species "${slug}": ${err.message}</p>`;
      }
    }

    loadSpecies();
  </script>
</body>
</html>
