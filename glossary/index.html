<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Section | Decap CMS Pipeline Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  </style>
</head>
<body>
  <p><a href="../">&larr; Home</a></p>
  <div id="page">Loading&hellip;</div>

  <script>
    const OWNER = 'BRITorg';
    const REPO = 'decap_eval';
    const BRANCH = 'main';

    function parseFrontMatter(raw) {
      const match = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
      if (!match) return { data: {}, body: raw };
      const data = {};
      match[1].split('\n').forEach(line => {
        const idx = line.indexOf(':');
        if (idx === -1) return;
        const key = line.slice(0, idx).trim();
        const value = line.slice(idx + 1).trim();
        data[key] = value;
      });
      return { data, body: match[2].trim() };
    }

    function renderInline(text) {
      return text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    }

    function renderBody(body) {
      return body
        .split(/\n\n+/)
        .map(p => `<p>${renderInline(p.trim())}</p>`)
        .join('\n');
    }

    function slugFromPath() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      return parts[parts.length - 1];
    }

    async function loadPage() {
      const container = document.getElementById('page');
      const slug = slugFromPath();
      try {
        const res = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/content/pages/${slug}.md`);
        if (!res.ok) throw new Error(`Not found: ${slug}`);
        const raw = await res.text();
        const { data, body } = parseFrontMatter(raw);
        container.innerHTML = `<h1>${data.title || slug}</h1>${renderBody(body)}`;
      } catch (err) {
        container.innerHTML = `<p>Could not load page "${slug}": ${err.message}</p>`;
      }
    }

    loadPage();
  </script>
</body>
</html>
