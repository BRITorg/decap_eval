<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decap CMS Pipeline Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    article { border-top: 1px solid #ddd; padding-top: 1rem; margin-top: 1rem; }
    h1 { margin-bottom: 0.25rem; }
    .meta { color: #666; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Decap CMS Pipeline Test</h1>
  <p class="meta">This page fetches every markdown file in <code>content/pages/</code> straight from the GitHub API and renders it client-side &mdash; no build step. Publishing a new entry through <a href="admin/">/admin/</a> should make it appear here after the next Pages rebuild.</p>
  <div id="pages">Loading pages&hellip;</div>

  <script>
    const OWNER = 'BRITorg';
    const REPO = 'decap_eval';
    const BRANCH = 'main';
    const DIR = 'content/pages';

    function parseFrontMatter(raw) {
      const match = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
      if (!match) return { data: {}, body: raw };
      const data = {};
      match[1].split('\n').forEach(line => {
        const idx = line.indexOf(':');
        if (idx === -1) return;
        const key = line.slice(0, idx).trim();
        const value = line.slice(idx + 1).trim();
        data[key] = value;
      });
      return { data, body: match[2].trim() };
    }

    function renderBody(body) {
      return body
        .split(/\n\n+/)
        .map(p => `<p>${p.trim()}</p>`)
        .join('\n');
    }

    async function loadPages() {
      const container = document.getElementById('pages');
      try {
        const listRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}?ref=${BRANCH}`);
        if (!listRes.ok) throw new Error(`Directory listing failed: ${listRes.status}`);
        const files = await listRes.json();
        const mdFiles = files.filter(f => f.name.endsWith('.md'));

        const pages = await Promise.all(mdFiles.map(async f => {
          const res = await fetch(f.download_url);
          const raw = await res.text();
          const { data, body } = parseFrontMatter(raw);
          return { name: f.name, title: data.title || f.name, body };
        }));

        container.innerHTML = pages
          .map(p => `<article><h2>${p.title}</h2>${renderBody(p.body)}</article>`)
          .join('\n');
      } catch (err) {
        container.innerHTML = `<p>Could not load pages: ${err.message}</p>`;
      }
    }

    loadPages();
  </script>
</body>
</html>
